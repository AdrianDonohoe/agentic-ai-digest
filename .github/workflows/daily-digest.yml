name: Daily Agentic AI Digest

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:        # Allow manual trigger from the Actions tab

permissions:
  contents: write           # Required to commit seen.db back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY:   ${{ secrets.TAVILY_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
        run: python main.py

      - name: Commit updated seen.db
        # Always run so partial progress is persisted even after a soft failure.
        # main.py exits 1 on hard failure, which skips this step — that's intentional.
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.db
          if git diff --staged --quiet; then
            echo "seen.db unchanged — nothing to commit."
          else
            git commit -m "chore: update seen.db [skip ci]"
            git push
          fi
